# Bypass strict dependency checks by giving it a guaranteed system binary
GenericCmdDependency "echo"

# The direct pipeline: assigns the text, swaps newlines for spaces, runs Piper, and plays via aplay
# The "Laundered" Pipeline: Now with double-escaped newlines to save your 'n's
GenericExecuteSynth "export XDATA=\'$DATA\'; TMPWAV=/tmp/piper_tts.wav; echo \"$XDATA\" | tr '\\n' ' ' | sed 's/[-._]/ /g' | /opt/piper/piper --model /opt/piper/en_GB-northern_english_male-medium.onnx --output_file $TMPWAV && pw-play $TMPWAV; rm -f $TMPWAV"

# Define the voice mapping
AddVoice "en" "male1" "piper"
